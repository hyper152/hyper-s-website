<script>
        // ==================== 配置 ====================
        const MODEL_NAME = 'qwen2.5-3b-hyper';

        let isGenerating = false;
        let conversationHistory = [];

        // ==================== 获取用户名（从登录系统） ====================
        let userName = '游客';

        try {
            // 方法1：从 Auth 模块获取（如果已加载）
            if (typeof Auth !== 'undefined' && Auth.getLocalUser) {
                const localUser = Auth.getLocalUser();
                if (localUser && localUser.username) {
                    userName = localUser.username;
                    console.log('✅ 从 Auth 获取用户名:', userName);
                }
            }

            // 方法2：如果 Auth 未加载，直接从 localStorage 读取
            if (userName === '游客') {
                const userInfo = localStorage.getItem('user_info');
                if (userInfo) {
                    try {
                        const user = JSON.parse(userInfo);
                        if (user && user.username) {
                            userName = user.username;
                            console.log('✅ 从 localStorage 获取用户名:', userName);
                        }
                    } catch (e) { }
                }
            }
        } catch (e) {
            console.warn('获取用户名失败，使用默认值:', e);
        }

        console.log('👤 当前用户:', userName);

        // ==================== AI提问保存函数 ====================
        function saveAIQuestion(question, userName) {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const time = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

            const data = {
                time: time,
                question: question,
                user: userName || '游客'
            };

            fetch('/api/ollama/save-ai-question', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(res => res.json()).then(res => {
                if (res && res.status === 'ok') {
                    console.log('✅ AI问题已保存:', question.substring(0, 30) + '...');
                }
            }).catch(e => {
                console.warn('⚠️ AI问题保存失败:', e);
            });
        }

        // ==================== 工具函数 ====================
        function renderMarkdown(text) {
            if (!text) return '';

            let html = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
            html = html.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>');
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            html = html.replace(/\n/g, '<br>');

            return html;
        }

        function addSystemMessage(content, duration = 3000) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message system';
            messageDiv.innerHTML = `
                <div class="message-avatar"><i class="fas fa-info-circle"></i></div>
                <div class="message-content">${content}</div>
            `;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            if (duration > 0) {
                setTimeout(() => {
                    if (messageDiv.parentNode) {
                        messageDiv.remove();
                    }
                }, duration);
            }

            return messageDiv;
        }

        async function checkModelAvailability() {
            try {
                const res = await fetch('/api/ollama/models');
                const data = await res.json();

                if (data.models && data.models.length > 0) {
                    const hasModel = data.models.some(m =>
                        m.name === MODEL_NAME || m.name.includes(MODEL_NAME) || m.name.includes('hyper')
                    );

                    if (hasModel) {
                        console.log(`✅ 模型可用`);
                        return true;
                    } else {
                        console.warn(`⚠️ 模型未找到，可用:`, data.models.map(m => m.name));
                        addSystemMessage(`⚠️ 模型 qwen2.5-3b-hyper 未找到，将尝试使用默认模型`, 0);
                        return true; // 继续尝试，让后端决定
                    }
                }
                return true;
            } catch (err) {
                console.error('连接 Ollama 失败:', err);
                addSystemMessage('❌ 无法连接到 Ollama 服务', 0);
                return false;
            }
        }

        function addMessage(role, content) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const avatarIcon = role === 'user' ? 'fa-user' : 'fa-robot';
            messageDiv.innerHTML = `
                <div class="message-avatar"><i class="fas ${avatarIcon}"></i></div>
                <div class="message-content">${renderMarkdown(content)}</div>
            `;

            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return messageDiv;
        }

        async function sendMessage(messageText = null) {
            const input = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const message = messageText || input.value.trim();

            if (!message || isGenerating) return;

            if (!messageText) {
                input.value = '';
                input.style.height = 'auto';
            }

            isGenerating = true;
            sendBtn.disabled = true;

            conversationHistory.push({ role: 'user', content: message });
            addMessage('user', message);

            // ========== 保存AI提问记录（包括游客） ==========
            saveAIQuestion(message, userName);

            const assistantMsgDiv = addMessage('assistant', '');
            const contentDiv = assistantMsgDiv.querySelector('.message-content');

            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.innerHTML = '<span></span><span></span><span></span>';
            contentDiv.appendChild(typingDiv);

            try {
                const res = await fetch('/api/ollama/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: MODEL_NAME,
                        messages: conversationHistory,
                        stream: true
                    })
                });

                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }

                contentDiv.innerHTML = '';
                let fullContent = '';

                const reader = res.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n').filter(line => line.trim());

                    for (const line of lines) {
                        try {
                            const data = JSON.parse(line);
                            if (data.message?.content) {
                                fullContent += data.message.content;
                                contentDiv.innerHTML = renderMarkdown(fullContent);
                                document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
                            }
                        } catch (e) { }
                    }
                }

                if (!fullContent) {
                    contentDiv.innerHTML = '（模型没有返回内容）';
                } else {
                    conversationHistory.push({ role: 'assistant', content: fullContent });
                }
            } catch (err) {
                console.error('发送失败:', err);
                contentDiv.innerHTML = `❌ 错误: ${err.message}`;
                addSystemMessage(`❌ 请求失败，请稍后重试`, 4000);
            } finally {
                isGenerating = false;
                sendBtn.disabled = false;
                input.focus();
            }
        }

        // ==================== 事件绑定 ====================
        document.getElementById('sendBtn').addEventListener('click', () => sendMessage());

        document.getElementById('messageInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        document.getElementById('messageInput').addEventListener('input', function () {
