<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大学物理概念题 - 交互式选择题自测</title>
    <style>
        :root {
            --bg: #f5f0eb;
            --card-bg: #ffffff;
            --text: #2c2416;
            --text-secondary: #5c5347;
            --accent: #8b5e3c;
            --accent-light: #c9a87c;
            --correct: #3a7d44;
            --correct-bg: #e8f5e9;
            --incorrect: #c0392b;
            --incorrect-bg: #fdecea;
            --border: #e0d5c7;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 6px 24px rgba(0, 0, 0, 0.10);
            --radius: 12px;
            --transition: 0.2s ease;
            --font-main: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'PingFang SC', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
            font-size: 17px;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #3e2d1f 0%, #5a3e2b 40%, #6b4c34 100%);
            color: #f5e6d3;
            padding: 28px 20px 24px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.25);
        }
        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            margin-bottom: 4px;
        }
        .header .subtitle {
            font-size: 0.9rem;
            opacity: 0.8;
            font-weight: 400;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
            padding: 14px 20px;
            background: #fff;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 92px;
            z-index: 99;
            box-shadow: var(--shadow);
            font-size: 0.9rem;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            background: #faf7f2;
            font-weight: 500;
            white-space: nowrap;
        }
        .stat-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .stat-dot.total {
            background: #6b4c34;
        }
        .stat-dot.done {
            background: #3a7d44;
        }
        .stat-dot.correct {
            background: #27ae60;
        }
        .stat-dot.incorrect {
            background: #e74c3c;
        }
        .stat-dot.remaining {
            background: #ccc;
        }
        .btn {
            padding: 8px 18px;
            border-radius: 20px;
            border: 1.5px solid var(--accent);
            background: #fff;
            color: var(--accent);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all var(--transition);
            white-space: nowrap;
            font-family: var(--font-main);
        }
        .btn:hover {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 14px rgba(139, 94, 60, 0.3);
        }
        .btn.active-filter {
            background: var(--accent);
            color: #fff;
        }
        .btn.reset-btn {
            background: #fdecea;
            border-color: #c0392b;
            color: #c0392b;
        }
        .btn.reset-btn:hover {
            background: #c0392b;
            color: #fff;
        }

        /* Filter Row */
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            padding: 10px 20px;
            background: #fff;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 144px;
            z-index: 98;
            box-shadow: var(--shadow);
        }
        .filter-btn {
            padding: 6px 14px;
            border-radius: 16px;
            border: 1.5px solid #d5c9b8;
            background: #fdfaf6;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all var(--transition);
            font-family: var(--font-main);
            color: #5c5347;
        }
        .filter-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: #fdf5ec;
        }
        .filter-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            font-weight: 700;
        }

        /* Main Content */
        .main-content {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }
        .file-section {
            margin-bottom: 28px;
        }
        .file-section-header {
            font-size: 1rem;
            font-weight: 700;
            color: #3e2d1f;
            padding: 10px 16px;
            background: #f0e8db;
            border-radius: 8px;
            margin-bottom: 14px;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .file-section-header .icon {
            font-size: 1.2rem;
        }
        .file-section-header .count {
            font-weight: 400;
            font-size: 0.8rem;
            color: #6b5d4a;
            margin-left: auto;
        }

        /* Question Card */
        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            transition: all var(--transition);
            position: relative;
            scroll-margin-top: 200px;
        }
        .question-card:hover {
            box-shadow: var(--shadow-hover);
            border-color: #ccc0ad;
        }
        .question-card.answered-correct {
            border-left: 4px solid var(--correct);
            background: #fafff9;
        }
        .question-card.answered-incorrect {
            border-left: 4px solid var(--incorrect);
            background: #fffdfb;
        }
        .q-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.78rem;
            color: var(--text-secondary);
        }
        .q-tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.72rem;
            letter-spacing: 0.02em;
        }
        .q-tag.single {
            background: #e8f0fe;
            color: #1a56b8;
        }
        .q-tag.judge {
            background: #fef3e0;
            color: #b85c1a;
        }
        .q-tag.multi {
            background: #f0e6f6;
            color: #6b2d8b;
        }
        .q-source {
            font-family: var(--font-mono);
            font-size: 0.73rem;
            background: #f5f0eb;
            padding: 2px 8px;
            border-radius: 4px;
            color: #6b5d4a;
        }
        .q-concept {
            font-size: 0.73rem;
            color: #8b7355;
            font-style: italic;
        }
        .q-text {
            font-size: 1.05rem;
            font-weight: 500;
            margin-bottom: 12px;
            color: #1a1a1a;
            line-height: 1.65;
        }
        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .option-item {
            padding: 10px 14px;
            border: 1.5px solid #e8e0d5;
            border-radius: 8px;
            cursor: pointer;
            transition: all var(--transition);
            font-size: 0.97rem;
            position: relative;
            background: #fdfcf9;
            user-select: none;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .option-item:hover {
            border-color: #b8956e;
            background: #fdf7ef;
            transform: translateX(2px);
        }
        .option-item:active {
            transform: scale(0.985);
        }
        .option-item.selected {
            border-color: #6b4c34;
            background: #f5ede0;
            font-weight: 600;
        }
        .option-item.show-correct {
            border-color: var(--correct) !important;
            background: var(--correct-bg) !important;
            font-weight: 700 !important;
            animation: pulse-green 0.5s ease;
        }
        .option-item.show-incorrect {
            border-color: var(--incorrect) !important;
            background: var(--incorrect-bg) !important;
            animation: shake 0.4s ease;
        }
        .option-item.show-correct-dim {
            border-color: #a3d4a8 !important;
            background: #f4faf5 !important;
            opacity: 0.85;
        }
        .option-letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #e8e0d5;
            font-weight: 700;
            font-size: 0.85rem;
            flex-shrink: 0;
            color: #5c4a30;
        }
        .option-item.show-correct .option-letter {
            background: #27ae60;
            color: #fff;
        }
        .option-item.show-incorrect .option-letter {
            background: #e74c3c;
            color: #fff;
        }
        .feedback-msg {
            margin-top: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 6px;
            display: none;
        }
        .feedback-msg.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        .feedback-msg.correct-fb {
            background: #e8f5e9;
            color: #1b5e20;
        }
        .feedback-msg.incorrect-fb {
            background: #fdecea;
            color: #b71c1c;
        }
        .locked-overlay {
            position: absolute;
            inset: 0;
            background: transparent;
            pointer-events: none;
            border-radius: var(--radius);
        }
        .question-card.answered .locked-overlay {
            pointer-events: all;
        }

        @keyframes pulse-green {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.4);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(39, 174, 96, 0);
            }
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-6px);
            }
            40% {
                transform: translateX(6px);
            }
            60% {
                transform: translateX(-4px);
            }
            80% {
                transform: translateX(4px);
            }
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Scroll to top */
        .scroll-top-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            z-index: 200;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .scroll-top-btn:hover {
            background: #6b3e1f;
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        /* Responsive */
        /* Math rendering — vectors & fractions */
        .vec {
            display: inline-block;
            position: relative;
        }
        .vec::after {
            content: '→';
            position: absolute;
            left: 50%;
            top: -0.7em;
            transform: translateX(-50%);
            font-size: 0.72em;
            line-height: 1;
            font-weight: normal;
            pointer-events: none;
        }
        .frac {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            margin: 0 2px;
        }
        .frac .num {
            padding: 0 0.3em 1px;
            border-bottom: 1.5px solid var(--text);
        }
        .frac .den {
            padding: 1px 0.3em 0;
        }

        @media (max-width: 640px) {
            .header h1 {
                font-size: 1.3rem;
            }
            .stats-bar {
                gap: 6px;
                padding: 10px 8px;
                font-size: 0.78rem;
            }
            .stat-item {
                padding: 4px 10px;
                font-size: 0.75rem;
            }
            .btn {
                padding: 6px 12px;
                font-size: 0.75rem;
            }
            .filter-row {
                gap: 5px;
                padding: 8px;
                top: 136px;
            }
            .filter-btn {
                padding: 4px 10px;
                font-size: 0.7rem;
            }
            .question-card {
                padding: 14px;
            }
            .q-text {
                font-size: 0.88rem;
            }
            .option-item {
                padding: 8px 10px;
                font-size: 0.82rem;
                gap: 6px;
            }
            .option-letter {
                width: 24px;
                height: 24px;
                font-size: 0.75rem;
            }
            .stats-bar {
                top: 80px;
            }
            .filter-row {
                top: 128px;
            }
            .question-card {
                scroll-margin-top: 180px;
            }
        }
    </style>
</head>
<body>

    <div style="display:flex; gap:12px; margin-bottom:12px; font-size:0.9rem; justify-content:center; padding-top:16px;">

    </div>

    <div class="header">
        <h1>📚 大学物理概念题 · 交互自测</h1>
        <p class="subtitle">覆盖7份资料 · 选择题 & 判断题 · 点击选项即时反馈</p>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar" id="statsBar">
        <span class="stat-item"><span class="stat-dot total"></span> 总计：<strong id="totalCount">0</strong></span>
        <span class="stat-item"><span class="stat-dot done"></span> 已答：<strong id="answeredCount">0</strong></span>
        <span class="stat-item"><span class="stat-dot correct"></span> 正确：<strong id="correctCount">0</strong></span>
        <span class="stat-item"><span class="stat-dot incorrect"></span> 错误：<strong id="incorrectCount">0</strong></span>
        <span class="stat-item"><span class="stat-dot remaining"></span> 剩余：<strong id="remainingCount">0</strong></span>
        <button class="btn reset-btn" onclick="resetAll()" title="清除所有答案重新开始">🔄 全部重置</button>

    <!-- Filter Row -->
    <div class="filter-row" id="filterRow">
        <button class="filter-btn active" data-filter="all">📋 全部题目</button>
        <button class="filter-btn" data-filter="file3">📄 PHYS10031-2025春-A</button>
        <button class="filter-btn" data-filter="file5">📄 PHYS10013-2024春-A</button>
        <button class="filter-btn" data-filter="file2">📄 PHYS10016-2023春-A</button>

        <button class="filter-btn" data-filter="unanswered">⏳ 未答题</button>
        <button class="filter-btn" data-filter="wrong">❌ 错题</button>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        <!-- Questions will be rendered here dynamically -->
    </div>

    <button class="scroll-top-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="回到顶部">⬆</button>

    <script>
        // ==================== QUESTION DATABASE ====================

        // ==================== RENDER ENGINE ====================
        let answeredMap = {}; // { questionId: { userAnswer, isCorrect } }

        function getQuestionById(id) {
            return allQuestions.find(q => q.id === id);
        }

        function renderMathHTML(text) {
            // Replace \vec{X} with CSS styled vector
            text = text.replace(/\\vec\{([^}]+)\}/g, '<span class="vec">$1</span>');
            // Replace character + combining arrow (U+20D7) with CSS styled vector
            text = text.replace(/([a-zA-Z])⃗/g, '<span class="vec">$1</span>');
            // Replace LaTeX \frac{a}{b} with CSS fraction
            text = text.replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g, '<span class="frac"><span class="num">$1</span><span class="den">$2</span></span>');
            return text;
        }

        function renderAllQuestions(filterKey = 'all') {
            const container = document.getElementById('mainContent');
            container.innerHTML = '';

            // Group by file
            const fileOrder = ['PHYS10031-2025春-A', 'PHYS10013-2024春-A', 'PHYS10016-2023春-A', 'PHYS10016-2022春-A', 'PHYS10013-2019春-A', '课后习题', '物理概念精练'];
            const grouped = {};
            fileOrder.forEach(f => { grouped[f] = []; });

            allQuestions.forEach(q => {
                if (!grouped[q.file]) grouped[q.file] = [];
                grouped[q.file].push(q);
            });

            let visibleCount = 0;
            fileOrder.forEach(fileName => {
                const questions = grouped[fileName];
                if (!questions || questions.length === 0) return;

                // Filter
                let filteredQuestions = questions;
                if (filterKey === 'unanswered') {
                    filteredQuestions = questions.filter(q => !(q.id in answeredMap));
                } else if (filterKey === 'wrong') {
                    filteredQuestions = questions.filter(q => (q.id in answeredMap) && !answeredMap[q.id]
                        .isCorrect);
                } else if (filterKey.startsWith('file')) {
                    const fk = filterKey; // 'file1','file2',...
                    filteredQuestions = questions.filter(q => q.fileKey === fk);
                }

                if (filteredQuestions.length === 0) return;

                const section = document.createElement('div');
                section.className = 'file-section';
                const fileIconMap = {
                    'PHYS10016-2022春-A': '📘',
                    'PHYS10016-2023春-A': '📙',
                    'PHYS10031-2025春-A': '📗',
                    'PHYS10013-2019春-A': '📕',
                    'PHYS10013-2024春-A': '📓',
                    '课后习题': '📝',
                    '物理概念精练': '🧠'
                };
                const icon = fileIconMap[fileName] || '📄';
                section.innerHTML = `
                    <div class="file-section-header">
                        <span class="icon">${icon}</span> ${fileName}
                        <span class="count">${filteredQuestions.length} 题</span>
                    </div>
                `;

                filteredQuestions.forEach(q => {
                    const card = createQuestionCard(q);
                    section.appendChild(card);
                    visibleCount++;
                });

                container.appendChild(section);
            });

            if (visibleCount === 0) {
                container.innerHTML = `
                    <div style="text-align:center;padding:60px 20px;color:#8b7355;">
                        <p style="font-size:1.2rem;">🎉 没有匹配的题目</p>
                        <p style="font-size:0.9rem;">请尝试其他筛选条件</p>
                    </div>
                `;
            }

            updateStats();
        }

        function createQuestionCard(q) {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = 'card-' + q.id;

            // Tag
            let tagHTML = '';
            if (q.type === 'single') {
                tagHTML = '<span class="q-tag single">单选题</span>';
            } else if (q.type === 'judge') {
                tagHTML = '<span class="q-tag judge">判断题</span>';
            } else if (q.type === 'multi') {
                tagHTML = '<span class="q-tag multi">多选题</span>';
            }

            card.innerHTML = `
                <div class="q-meta">
                    ${tagHTML}
                    <span class="q-source">${q.source}</span>
                    <span class="q-concept">📌 ${q.concept}</span>
                </div>
                <div class="q-text">${renderMathHTML(q.text)}</div>
                <ul class="options-list">
                    ${q.options.map((opt, idx) => {
                        const letter = q.type === 'judge' ? (idx === 0 ? '✓' : '✗') : String.fromCharCode(65 + idx);
                        return `
                            <li class="option-item" data-qid="${q.id}" data-idx="${idx}">
                                <span class="option-letter">${letter}</span>
                                <span>${renderMathHTML(opt)}</span>
                            </li>
                        `;
                    }).join('')}
                </ul>
                <div class="feedback-msg" id="fb-${q.id}"></div>
                <div class="locked-overlay"></div>
            `;

            // Check if already answered
            if (q.id in answeredMap) {
                card.classList.add('answered');
                const ua = answeredMap[q.id];
                if (q.type === 'multi') {
                    // Highlight all selected options
                    const options = card.querySelectorAll('.option-item');
                    options.forEach(opt => {
                        const idx = parseInt(opt.dataset.idx);
                        const isCorrectOption = q.answer.includes(idx);
                        const wasSelected = ua.userAnswer.includes(idx);
                        if (wasSelected && isCorrectOption) {
                            opt.classList.add('show-correct');
                        } else if (wasSelected && !isCorrectOption) {
                            opt.classList.add('show-incorrect');
                        } else if (!wasSelected && isCorrectOption) {
                            opt.classList.add('show-correct-dim');
                        }
                    });
                } else {
                    const correctIdx = q.answer;
                    const userIdx = ua.userAnswer;
                    const options = card.querySelectorAll('.option-item');
                    if (userIdx === correctIdx) {
                        options[correctIdx].classList.add('show-correct');
                    } else {
                        options[userIdx].classList.add('show-incorrect');
                        options[correctIdx].classList.add('show-correct');
                    }
                }
                // Show feedback
                const fb = card.querySelector('.feedback-msg');
                if (ua.isCorrect) {
                    fb.textContent = '✅ 回答正确！';
                    fb.className = 'feedback-msg show correct-fb';
                    card.classList.add('answered-correct');
                } else {
                    const correctStr = q.type === 'multi' ?
                        q.answer.map(i => q.options[i].charAt(0)).join('、') :
                        (q.type === 'judge' ? (q.answer === 0 ? '正确' : '错误') : q.options[q.answer].charAt(0));
                    fb.textContent = '❌ 回答错误！正确答案是：' + correctStr;
                    fb.className = 'feedback-msg show incorrect-fb';
                    card.classList.add('answered-incorrect');
                }
            }

            // Add click handlers
            const optionItems = card.querySelectorAll('.option-item');
            optionItems.forEach(opt => {
                opt.addEventListener('click', function() {
                    if (q.id in answeredMap) return; // Already answered
                    const idx = parseInt(this.dataset.idx);
                    handleAnswer(q, idx, card);
                });
            });

            return card;
        }

        function handleAnswer(q, selectedIdx, card) {
            if (q.id in answeredMap) return;

            let userAnswer;
            let isCorrect;

            if (q.type === 'multi') {
                // For multi-select, toggle selection and confirm on double-click or use a different approach
                // Simplified: single click selects, clicking an already-selected option confirms
                // Better approach for multi: let user toggle, then show a confirm button
                // For simplicity, we'll treat multi as: click each correct option to toggle, then click a "确认" button
                // Actually, let's use a simpler approach: first click selects, second click on same option confirms all selections
                // Even simpler: just use checkboxes style - click to toggle highlight, then auto-confirm after a short delay or use a confirm button
                // Let's implement: click toggles selection highlight, a small confirm button appears
                handleMultiSelect(q, selectedIdx, card);
                return;
            } else {
                userAnswer = selectedIdx;
                isCorrect = (selectedIdx === q.answer);
            }

            // Record answer
            answeredMap[q.id] = { userAnswer, isCorrect };
            card.classList.add('answered');

            // Show visual feedback
            const options = card.querySelectorAll('.option-item');
            const correctIdx = q.answer;

            if (isCorrect) {
                options[correctIdx].classList.add('show-correct');
                card.classList.add('answered-correct');
                const fb = card.querySelector('.feedback-msg');
                fb.textContent = '✅ 回答正确！';
                fb.className = 'feedback-msg show correct-fb';
            } else {
                options[userAnswer].classList.add('show-incorrect');
                options[correctIdx].classList.add('show-correct');
                card.classList.add('answered-incorrect');
                const fb = card.querySelector('.feedback-msg');
                const correctStr = q.type === 'judge' ? (q.answer === 0 ? '正确' : '错误') : q.options[q.answer]
                    .charAt(0);
                fb.textContent = '❌ 回答错误！正确答案是：' + correctStr;
                fb.className = 'feedback-msg show incorrect-fb';
            }

            updateStats();
            // Scroll to card smoothly
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function handleMultiSelect(q, selectedIdx, card) {
            // Get current selections for this card
            const selections = card._multiSelections || new Set();
            if (selections.has(selectedIdx)) {
                selections.delete(selectedIdx);
            } else {
                selections.add(selectedIdx);
            }
            card._multiSelections = selections;

            // Update visual highlights
            const options = card.querySelectorAll('.option-item');
            options.forEach(opt => {
                const idx = parseInt(opt.dataset.idx);
                if (selections.has(idx)) {
                    opt.classList.add('selected');
                } else {
                    opt.classList.remove('selected');
                }
            });

            // Show or update confirm button
            let confirmBtn = card.querySelector('.confirm-multi-btn');
            if (!confirmBtn) {
                confirmBtn = document.createElement('button');
                confirmBtn.className = 'btn confirm-multi-btn';
                confirmBtn.textContent = '✓ 确认提交';
                confirmBtn.style.cssText = 'margin-top:10px;';
                confirmBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (q.id in answeredMap) return;
                    const finalSelections = card._multiSelections || new Set();
                    if (finalSelections.size === 0) return; // Must select at least one
                    const userAnswer = Array.from(finalSelections).sort((a, b) => a - b);
                    const correctAnswer = [...q.answer].sort((a, b) => a - b);
                    const isCorrect = JSON.stringify(userAnswer) === JSON.stringify(correctAnswer);

                    answeredMap[q.id] = { userAnswer, isCorrect };
                    card.classList.add('answered');

                    // Clear selection highlights, show correct/incorrect
                    const opts = card.querySelectorAll('.option-item');
                    opts.forEach(opt => {
                        opt.classList.remove('selected');
                        const idx = parseInt(opt.dataset.idx);
                        const isCorrectOption = q.answer.includes(idx);
                        const wasSelected = userAnswer.includes(idx);
                        if (wasSelected && isCorrectOption) {
                            opt.classList.add('show-correct');
                        } else if (wasSelected && !isCorrectOption) {
                            opt.classList.add('show-incorrect');
                        } else if (!wasSelected && isCorrectOption) {
                            opt.classList.add('show-correct-dim');
                        }
                    });

                    // Remove confirm button
                    if (confirmBtn) confirmBtn.remove();

                    const fb = card.querySelector('.feedback-msg');
                    if (isCorrect) {
                        fb.textContent = '✅ 回答正确！';
                        fb.className = 'feedback-msg show correct-fb';
                        card.classList.add('answered-correct');
                    } else {
                        const correctStr = q.answer.map(i => q.options[i].charAt(0)).join('、');
                        fb.textContent = '❌ 回答错误！正确答案是：' + correctStr;
                        fb.className = 'feedback-msg show incorrect-fb';
                        card.classList.add('answered-incorrect');
                    }
                    updateStats();
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                });
                card.appendChild(confirmBtn);
            }
            confirmBtn.textContent = selections.size > 0 ? `✓ 确认提交 (已选${selections.size}项)` : '✓ 确认提交';
        }

        function updateStats() {
            const total = allQuestions.length;
            const answered = Object.keys(answeredMap).length;
            let correct = 0;
            let incorrect = 0;
            Object.values(answeredMap).forEach(v => {
                if (v.isCorrect) correct++;
                else incorrect++;
            });
            const remaining = total - answered;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('answeredCount').textContent = answered;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('incorrectCount').textContent = incorrect;
            document.getElementById('remainingCount').textContent = remaining;
        }

        function resetAll() {
            if (Object.keys(answeredMap).length > 0) {
                if (!confirm('确定要清除所有答案并重新开始吗？此操作不可撤销。')) return;
            }
            answeredMap = {};
            // Clear multi-selections stored on cards
            document.querySelectorAll('.question-card').forEach(card => {
                card._multiSelections = new Set();
            });
            const activeFilter = document.querySelector('.filter-btn.active');
            const filterKey = activeFilter ? activeFilter.dataset.filter : 'all';
            renderAllQuestions(filterKey);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ==================== FILTER HANDLING ====================
        document.getElementById('filterRow').addEventListener('click', function(e) {
            if (e.target.classList.contains('filter-btn')) {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                const filterKey = e.target.dataset.filter;
                renderAllQuestions(filterKey);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

        // ==================== INIT ====================
        function init() {
            renderAllQuestions('all');
            updateStats();
        }

        init();

        console.log('📚 大学物理概念题交互自测已就绪');
        console.log('  总计题目：' + allQuestions.length + ' 道');
        console.log('  单选题：' + allQuestions.filter(q => q.type === 'single').length + ' 道');
        console.log('  判断题：' + allQuestions.filter(q => q.type === 'judge').length + ' 道');
        console.log('  多选题：' + allQuestions.filter(q => q.type === 'multi').length + ' 道');
        console.log('  点击选项即可作答，绿色=正确，红色=错误');
        console.log('  使用顶部筛选栏按文件来源或答题状态筛选');
    </script>
</body>
