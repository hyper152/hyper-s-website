<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>网站 AI 知识库 | Hyper</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei",sans-serif;color:#1f2937;background:linear-gradient(135deg,#eef2ff,#f5f3ff);min-height:100vh}
        main{width:min(920px,calc(100% - 32px));margin:0 auto;padding:48px 0}.back{color:#6366f1;text-decoration:none}.hero{text-align:center;margin:35px 0}.hero i{font-size:3rem;color:#6d5ce7}.hero h1{margin:14px 0 8px}.hero p{color:#6b7280}
        .search{display:flex;gap:10px;background:#fff;padding:12px;border-radius:18px;box-shadow:0 12px 35px rgba(76,66,160,.12)}input{flex:1;border:0;outline:0;padding:12px;font-size:1rem}button{border:0;border-radius:12px;padding:0 24px;color:#fff;background:linear-gradient(135deg,#667eea,#764ba2);cursor:pointer;font-weight:600}button:disabled{opacity:.55}
        #status{text-align:center;color:#6b7280;margin:24px}.result{display:block;background:#fff;border-radius:16px;padding:20px;margin:14px 0;text-decoration:none;color:inherit;box-shadow:0 6px 22px rgba(76,66,160,.08);transition:.2s}.result:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(76,66,160,.15)}.result h2{font-size:1.08rem;margin:0 0 10px;color:#4f46e5}.result p{line-height:1.7;margin:0;color:#4b5563}.source{display:block;margin-top:12px;color:#9ca3af;font-size:.82rem}
        @media(max-width:600px){main{padding-top:24px}.search{flex-direction:column}button{padding:13px}.hero h1{font-size:1.6rem}}
    </style>
</head>
<body><main>
    <a class="back" href="/home/"><i class="fas fa-arrow-left"></i> 返回首页</a>
    <section class="hero"><i class="fas fa-database"></i><h1>网站 AI 知识库</h1><p>由 OceanBase seekdb 提供语义检索，试试用自然语言搜索本站内容</p></section>
    <form class="search" id="searchForm"><input id="query" maxlength="200" placeholder="例如：你参加过哪些机器人比赛？" autocomplete="off"><button id="submit" type="submit"><i class="fas fa-search"></i> 搜索</button></form>
    <div id="status">输入一个问题开始检索</div><section id="results"></section>
</main><script>
const form=document.getElementById('searchForm'),query=document.getElementById('query'),status=document.getElementById('status'),results=document.getElementById('results'),submit=document.getElementById('submit');
const escapeHtml=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
form.addEventListener('submit',async event=>{event.preventDefault();const text=query.value.trim();if(!text)return;submit.disabled=true;status.textContent='正在从 seekdb 检索…';results.innerHTML='';try{const response=await fetch('/api/knowledge/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:text,limit:6})});const data=await response.json();if(!response.ok)throw new Error(data.message||`HTTP ${response.status}`);const items=data.data||[];status.textContent=items.length?`找到 ${items.length} 条相关内容`:'没有找到相关内容';results.innerHTML=items.map(item=>`<a class="result" href="${escapeHtml(item.url)}"><h2>${escapeHtml(item.title)}</h2><p>${escapeHtml(item.content)}</p><span class="source"><i class="fas fa-link"></i> ${escapeHtml(item.source)}</span></a>`).join('')}catch(error){status.textContent=`暂时无法搜索：${error.message}`;}finally{submit.disabled=false;}});
</script></body></html>
